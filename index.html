<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>做饭助手 · Cook Helper</title>
<meta name="description" content="今天吃什么、按食材找菜谱、搜菜谱。数据来自 HowToCook。">
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#2b2622; --mute:#7a7066; --line:#e8e1d6;
  --acc:#d9642b; --acc-ink:#ffffff; --acc-soft:#fbe8dc; --ok:#2f8f4e; --ok-soft:#e3f3e8; --warn:#b4691a; --warn-soft:#fbefd9;
  --r:14px; --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#171412; --card:#221e1b; --ink:#f1ebe3; --mute:#a2978a; --line:#352f2a;
  --acc:#ef7f46; --acc-ink:#1a120c; --acc-soft:#3a2418; --ok:#5cc07c; --ok-soft:#1d3125; --warn:#e3a24f; --warn-soft:#38291a;
  --shadow:none;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.bar{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;justify-content:space-between}
h1{font-size:18px;margin:0;letter-spacing:.2px}
.icon-btn{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--ink)}
.tabs{max-width:760px;margin:8px auto 0;display:flex;gap:2px}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font-weight:600;color:var(--mute);font-size:15px}
.tab[aria-selected=true]{color:var(--acc);border-bottom-color:var(--acc)}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:14px}
.stack>*+*{margin-top:12px}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:700}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--acc)}
.btn.small{padding:6px 10px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=search],select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:14px;line-height:1.3}
.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
.chip.miss{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.have{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.static{cursor:default}
.sug{margin-top:6px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.sug button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px}
.sug button:last-child{border-bottom:0}
.sec{margin:20px 0 8px;font-size:15px;font-weight:700}
.sec small{font-weight:400;color:var(--mute)}
.list{display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%;display:block}
.item .t{font-weight:700;font-size:16px}
.item .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:13px;color:var(--mute)}
.item .miss{margin-top:8px}
.slot{display:flex;gap:10px;align-items:stretch}
.slot .item{flex:1}
.slot .side{display:flex;flex-direction:column;gap:6px}
.role{font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.3px}
.stars{color:var(--acc);letter-spacing:1px}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--card);border:0;padding:6px 12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--acc-soft);color:var(--acc);font-weight:700}
label.chk{display:flex;gap:8px;align-items:center}
label.chk input{width:18px;height:18px;accent-color:var(--acc)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
@media (min-width:800px){.overlay{align-items:center}.sheet{border-radius:20px;max-height:86vh}}
.sheet h2{margin:0 0 4px;font-size:22px}
.sheet h3{margin:18px 0 6px;font-size:15px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
ol.steps{padding-left:0;list-style:none;margin:0;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 34px;border-bottom:1px solid var(--line)}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:13px;display:grid;place-items:center}
.tm{margin-left:6px;background:var(--acc-soft);color:var(--acc);border:0;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
ul.plain{margin:0;padding-left:20px}
#timers{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;padding:0 12px}
.timer{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;font-weight:700;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.timer.done{background:var(--acc);color:var(--acc-ink);animation:pulse 1s infinite}
.timer button{background:rgba(255,255,255,.2);border:0;color:inherit;border-radius:999px;padding:4px 10px}
@keyframes pulse{50%{transform:scale(1.04)}}
footer{max-width:760px;margin:24px auto 0;padding:0 16px;color:var(--mute);font-size:13px}
footer a{color:var(--acc)}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="title">🍳 做饭助手</h1>
    <div class="row">
      <button class="icon-btn" id="btnSet"></button>
      <button class="icon-btn" id="btnLang" aria-label="Language">EN</button>
    </div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
</header>
<main id="view"></main>
<footer id="foot"></footer>
<div id="timers" aria-live="polite"></div>
<div id="modal"></div>

<script src="recipes.js"></script>
<script>
"use strict";
/* ---------- helpers ---------- */
const R = window.RECIPES, ALIAS = window.ALIAS, EN = window.EN, EN2ZH = window.EN2ZH;
const $ = (s, e = document) => e.querySelector(s);
function h(tag, props, ...kids) {

const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- i18n ---------- */
const T = {
  zh: {
    title: "🍳 做饭助手", settings: "设置", tab_today: "今天吃什么", tab_have: "食材找菜", tab_search: "搜菜谱",
    people: "几个人吃", soup: "加汤/粥", staple: "加主食", reroll: "换一个", lock: "锁定", locked: "已锁定", all_new: "🎲 全部重新来",
    only_mine: "只从我有的食材里选（最多缺 2 样）", max_diff: "最高难度", any: "不限",
    shop: "购物清单", shop_empty: "不缺任何食材 🎉", copy: "复制清单", copied: "已复制 ✓", need_for: "用于",
    role_veg: "素菜", role_meat: "荤菜", role_soup: "汤 / 粥", role_staple: "主食",
    no_pool: "没有符合条件的菜，试试放宽筛选。",
    have_h: "你有哪些食材？", have_ph: "输入食材，如：番茄、鸡蛋 / tomato", add: "添加", clear: "清空",
    common: "常见食材（点一下选中）", assume: "默认家里有基础调料（盐、油、生抽等）",
    ready: "现在就能做", miss_n: n => `只差 ${n} 样`, no_have: "先选几样你有的食材吧 👆", no_match: "暂时没有匹配的菜，试试多加几样食材。",
    miss: "缺", search_ph: "搜菜名或食材，如：西红柿鸡蛋", all: "全部", fav: "★ 收藏", more: "显示更多", nores: "没找到，换个说法试试？",
    cat_all: "全部", ings: "食材", amounts: "每份用量（参考原文）", tools: "工具", steps: "步骤", notes_en: "提示：菜谱正文目前只有中文。",
    source: "查看原文（GitHub）", fav_add: "☆ 收藏", fav_del: "★ 已收藏", done_add: "做过了", done_del: "✓ 做过", optional: "（可选）", close: "关闭",
    s_title: "设置", s_excl: "忌口 / 过敏", s_excl_ph: "再加一个，如：香菜、花生", s_presets: "快捷选项",
    p_spicy: "不吃辣", p_seafood: "海鲜过敏", p_veg: "素食（蛋奶素）", s_basics: "我家一定有的基础调料", s_data: "数据与说明",
    s_about: n => `共 ${n} 道菜。菜谱数据来自开源项目 HowToCook（Unlicense），本页只做检索展示。`,
    s_note: "忌口与素食过滤是根据食材名称做的关键词判断，不保证 100% 准确，过敏请务必自己核对原文。",
    sec_have: "你有的", timer_done: "时间到！", stop: "停止", times: "次",
    ack1: "致谢：本页所有菜谱内容来自开源项目 ", ack2: "（作者 Anduin2017 及众多贡献者），以 Unlicense 协议开源。本页是基于该数据制作的非官方检索工具，与原项目无隶属关系。", diff: "难度", kcal: "大卡", people_unit: "人"
  },
  en: {
    title: "🍳 Cook Helper", settings: "Settings", tab_today: "What to eat", tab_have: "By ingredients", tab_search: "Search",
    people: "People eating", soup: "Add soup/porridge", staple: "Add staple", reroll: "Swap", lock: "Lock", locked: "Locked", all_new: "🎲 Shuffle all",
    only_mine: "Only dishes I can (almost) make — up to 2 missing", max_diff: "Max difficulty", any: "Any",
    shop: "Shopping list", shop_empty: "Nothing to buy 🎉", copy: "Copy list", copied: "Copied ✓", need_for: "for",
    role_veg: "Veggie", role_meat: "Meat / fish", role_soup: "Soup / porridge", role_staple: "Staple",
    no_pool: "No dishes match. Try relaxing the filters.",
    have_h: "What ingredients do you have?", have_ph: "Type an ingredient, e.g. tomato, 鸡蛋", add: "Add", clear: "Clear",
    common: "Common ingredients (tap to select)", assume: "Assume basic seasonings (salt, oil, soy sauce…)",
    ready: "Ready to cook", miss_n: n => `Missing ${n}`, no_have: "Pick some ingredients first 👆", no_match: "No matches yet — add more ingredients.",
    miss: "Need", search_ph: "Dish name or ingredient, e.g. 西红柿鸡蛋 / tomato egg", all: "All", fav: "★ Saved", more: "Show more", nores: "Nothing found. Try another term?",
    cat_all: "All", ings: "Ingredients", amounts: "Amounts per serving (as written)", tools: "Equipment", steps: "Steps", notes_en: "Note: recipe text is in Chinese only for now.",
    source: "View original (GitHub)", fav_add: "☆ Save", fav_del: "★ Saved", done_add: "Mark as cooked", done_del: "✓ Cooked", optional: " (optional)", close: "Close",
    s_title: "Settings", s_excl: "Avoid / allergies", s_excl_ph: "Add one, e.g. 香菜, peanut", s_presets: "Quick presets",
    p_spicy: "No spicy", p_seafood: "Seafood allergy", p_veg: "Vegetarian (eggs & dairy OK)", s_basics: "Seasonings I always have", s_data: "Data & notes",
    s_about: n => `${n} dishes. Recipe data comes from the open-source HowToCook project (Unlicense); this page only indexes and displays it.`,
    s_note: "Avoid/vegetarian filters work by keyword on ingredient names and are not 100% reliable. If you have allergies, check the original recipe yourself.",
    sec_have: "You have", timer_done: "Time's up!", stop: "Stop", times: "×",
    ack1: "Credits: all recipe content comes from the open-source project ", ack2: " (by Anduin2017 and many contributors), released under the Unlicense. This page is an unofficial search tool built on that data and is not affiliated with the original project.", diff: "Difficulty", kcal: "kcal", people_unit: ""
  }
};
let S = {
  lang: store.get("lang", /^zh/i.test(navigator.language || "zh") ? "zh" : "en"),
  tab: store.get("tab", "today"),
  have: store.get("have", []),
  assume: store.get("assume", true),
  basics: store.get("basics", window.BASICS),
  excl: store.get("excl", []),
  presets: store.get("presets", { spicy: false, seafood: false, veg: false }),
  favs: store.get("favs", []), done: store.get("done", []),
  people: store.get("people", 2), soup: store.get("soup", false), staple: store.get("staple", false),
  maxDiff: store.get("maxDiff", 0), onlyMine: store.get("onlyMine", false),
  menu: store.get("menu", null),
  q: "", cat: "all", shown: 40
};
const save = (...ks) => ks.forEach(k => store.set(k, S[k]));
const t = (k, ...a) => { const v = (T[S.lang][k] ?? T.zh[k] ?? k); return typeof v === "function" ? v(...a) : v; };

/* ---------- ingredient names ---------- */
const canonToAliases = {};
for (const [a, c] of Object.entries(ALIAS)) (canonToAliases[c] ||= []).push(a);
const ingName = x => (S.lang === "en" && EN[x]) ? `${EN[x]} (${x})` : x;
const ingShort = x => (S.lang === "en" && EN[x]) ? EN[x] : x;
function norm(tok) {
  tok = tok.trim(); if (!tok) return "";
  if (ALIAS[tok]) return ALIAS[tok];
  const lo = tok.toLowerCase();
  if (EN2ZH[lo]) return EN2ZH[lo];
  if (lo.endsWith("s") && EN2ZH[lo.slice(0, -1)]) return EN2ZH[lo.slice(0, -1)];
  return tok;
}

/* ---------- precompute ---------- */
const freq = {};
const catKeys = ["meat_dish", "aquatic", "vegetable_dish", "soup", "staple", "breakfast", "semi-finished", "dessert", "drink", "condiment"];
for (const r of R) {
  r._all = new Set(r.ings.flatMap(g => g.alts));
  r._req = r.ings.filter(g => !g.optional);
  r._text = r.name + " " + [...r._all].join(" ");
  for (const g of r._req) { const a = g.alts[0]; freq[a] = (freq[a] || 0) + 1; }
}
const aliasKeys = Object.keys(ALIAS).sort((a, b) => b.length - a.length);
function canonSet(str) { // find known ingredient names inside a string (longest first, non-overlapping)
  const found = new Set(); let s = str;
  for (const k of aliasKeys) if (s.includes(k)) { found.add(ALIAS[k]); s = s.split(k).join("·"); }
  return found;
}
for (const r of R) r._nameSet = canonSet(r.name);
const commonList = Object.entries(freq).filter(([k]) => !window.BASICS.includes(k) && (EN[k] || ALIAS[k])).sort((a, b) => b[1] - a[1]).slice(0, 40).map(e => e[0]);
const suggestPool = [...new Set([...Object.keys(freq), ...Object.keys(EN)])].filter(k => !/锅|碗|盘|刀/.test(k));

/* ---------- filters ---------- */
const SPICY = ["辣", "花椒", "藤椒", "豆瓣"];
const SEA = ["虾", "蟹", "鱼", "贝", "蛤", "蚝", "鱿", "墨", "海参", "海鲜", "鲍", "扇贝", "蛏"];
const MEAT = ["肉", "排骨", "鸡", "牛", "羊", "猪", "鸭", "鹅", "虾", "鱼", "蟹", "腊肠", "火腿", "培根", "香肠", "蚝", "贝", "鲍", "鱿", "高汤", "肉汤"];

function excluded(r) {
  const alts = [...r._all];
  const hay = r.name + " " + alts.join(" ");
  if (S.excl.some(x => x && hay.includes(norm(x)))) return true;
  if (S.presets.spicy && SPICY.some(k => hay.includes(k))) return true;
  if (S.presets.seafood && (r.cat === "aquatic" || SEA.some(k => hay.includes(k)))) return true;
  if (S.presets.veg && (r.cat === "meat_dish" || r.cat === "aquatic" || MEAT.some(k => strip(hay).includes(k)))) return true;
  return false;
}
const diffOK = r => !S.maxDiff || !r.diff || r.diff <= S.maxDiff;
function match(r) {
  const have = new Set(S.have), bs = new Set(S.assume ? S.basics : []);
  const sat = g => g.alts.some(a => have.has(a) || bs.has(a));
  const missing = r._req.filter(g => !sat(g));
  const matched = r._req.filter(g => g.alts.some(a => have.has(a)));
  return { missing, matched, total: r._req.length };
}
const missLabel = g => g.alts.map(ingShort).join(S.lang === "en" ? " / " : "/");

/* ---------- UI: shell ---------- */
function renderShell() {
  document.documentElement.lang = S.lang === "zh" ? "zh-CN" : "en";
  $("#title").textContent = t("title");
  $("#btnSet").textContent = "⚙ " + t("settings");
  $("#btnLang").textContent = S.lang === "zh" ? "EN" : "中文";
  const tabs = $("#tabs"); tabs.replaceChildren(
    ...[["today", "tab_today"], ["have", "tab_have"], ["search", "tab_search"]].map(([id, k]) =>
      h("button", { class: "tab", role: "tab", "aria-selected": S.tab === id, onclick: () => { S.tab = id; save("tab"); render(); } }, t(k))));
  $("#foot").replaceChildren(h("p", {}, t("ack1"), h("a", { href: "https://github.com/Anduin2017/HowToCook", target: "_blank", rel: "noopener" }, "HowToCook ↗"), t("ack2")));
}
function render() { renderShell(); const v = $("#view"); v.replaceChildren(); ({ today: viewToday, have: viewHave, search: viewSearch })[S.tab](v); }

/* ---------- recipe card ---------- */
const stars = n => n ? "★".repeat(n) + "☆".repeat(Math.max(0, 5 - n)) : "";
function recipeCard(r, extra) {
  const m = h("div", { class: "m" }, h("span", { class: "chip static" }, r.catZh), r.diff ? h("span", { class: "stars" }, stars(r.diff)) : null,
    r.kcal ? h("span", {}, `${r.kcal} ${t("kcal")}`) : null, S.done.includes(r.id) ? h("span", {}, "✓") : null, S.favs.includes(r.id) ? h("span", {}, "★") : null);
  return h("button", { class: "item", onclick: () => openRecipe(r) }, h("div", { class: "t" }, r.name), m, extra || null);
}

/* ---------- Tab: today ---------- */
const ROLES = { veg: ["vegetable_dish"], meat: ["meat_dish", "aquatic"], soup: ["soup"], staple: ["staple"] };
function poolFor(role, avoidIds) {
  return R.filter(r => ROLES[role].includes(r.cat) && !excluded(r) && diffOK(r) && !avoidIds.includes(r.id) &&
    (!S.onlyMine || !S.have.length || (() => { const m = match(r); return m.matched.length >= 1 && m.missing.length <= 2; })()));
}
function planRoles() {
  const n = S.people; let a = Math.floor((n + 1) / 2), b = n + 1 - a; // 素 a, 荤 b: a+b=N+1, a<=b<=a+1
  if (S.presets.veg) { a += b; b = 0; } // vegetarian: no meat slots
  return [...Array(b).fill("meat"), ...Array(a).fill("veg"), ...(S.soup ? ["soup"] : []), ...(S.staple ? ["staple"] : [])];
}
function genMenu(keepLocked) {
  const old = keepLocked && S.menu ? S.menu : [];
  const roles = planRoles(), out = [], used = [];
  const lockedByRole = {}; old.filter(s => s.locked).forEach(s => (lockedByRole[s.role] ||= []).push(s));
  for (const role of roles) {
    const lk = (lockedByRole[role] || []).shift();

}

}

}
